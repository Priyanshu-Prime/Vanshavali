org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# NOTE: org.gradle.java.home is intentionally NOT set here — a hard-coded JDK
# path is machine-specific and breaks Linux CI. Set it per-machine in your
# user-level ~/.gradle/gradle.properties if Gradle can't find a JDK on its own.
