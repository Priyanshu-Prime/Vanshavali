name: Release

# Full auto-release pipeline. On every push to main it reads the version from
# pubspec.yaml and, if no GitHub Release exists for that version yet, it:
#   1. runs analyze + tests (never release red code),
#   2. builds a SIGNED release APK (keystore reconstructed from secrets),
#   3. publishes a GitHub Release with the APK attached (so
#      https://github.com/Priyanshu-Prime/Vanshavali/releases/latest resolves —
#      the landing page's Download button target),
#   4. distributes that APK to the Firebase "village-testers" group.
# Idempotent: bump the version in pubspec.yaml to cut a new release; pushes that
# don't change the version are a no-op (the release already exists).
#
# Runs ONLY on push to main (and manual dispatch) — an owner-trusted event — so
# the signing/Firebase secrets are never exposed to fork PRs on this public repo.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Required repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64    base64 of android/upload-keystore.jks
#   ANDROID_KEYSTORE_PASSWORD  storePassword
#   ANDROID_KEY_ALIAS          keyAlias
#   ANDROID_KEY_PASSWORD       keyPassword
#   FIREBASE_SERVICE_ACCOUNT   JSON for a service account with the Firebase App
#                              Distribution Admin role (tester distribution)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from pubspec
        id: ver
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//' | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION  ->  tag v$VERSION"

      - name: Skip if a Release already exists for this version
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.ver.outputs.tag }} already exists — nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No release for ${{ steps.ver.outputs.tag }} yet — building one."
          fi

      - uses: subosito/flutter-action@v2
        if: steps.check.outputs.exists == 'false'
        with:
          channel: stable
          flutter-version: 3.38.8
          cache: true

      - name: Install dependencies
        if: steps.check.outputs.exists == 'false'
        run: flutter pub get

      - name: Generate localizations
        if: steps.check.outputs.exists == 'false'
        run: flutter gen-l10n

      - name: Generate Hive adapters
        if: steps.check.outputs.exists == 'false'
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        if: steps.check.outputs.exists == 'false'
        run: flutter analyze

      - name: Test
        if: steps.check.outputs.exists == 'false'
        run: flutter test

      - name: Reconstruct release keystore from secrets
        if: steps.check.outputs.exists == 'false'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Missing signing secrets — refusing to ship a debug-signed build to testers. Add ANDROID_KEYSTORE_* secrets."
            exit 1
          fi
          # storeFile is resolved by Gradle relative to android/app, so ../ points at android/
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          {
            echo "storeFile=../upload-keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Build signed release APK
        if: steps.check.outputs.exists == 'false'
        run: flutter build apk --release

      - name: Publish GitHub Release with APK
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk

      - name: Distribute to Firebase testers
        if: steps.check.outputs.exists == 'false'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::warning::No FIREBASE_SERVICE_ACCOUNT secret — skipping tester distribution (GitHub Release still published)."
            exit 0
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/fb-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/fb-sa.json"
          npm install -g firebase-tools
          firebase appdistribution:distribute \
            build/app/outputs/flutter-apk/app-release.apk \
            --app "1:975879058030:android:27cfa11a36aba40607ec7f" \
            --groups "village-testers" \
            --project "vanshavali-52e45" \
            --release-notes "Automated release ${{ steps.ver.outputs.tag }}"
          rm -f "$RUNNER_TEMP/fb-sa.json"
