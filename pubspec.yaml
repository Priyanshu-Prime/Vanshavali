name: vanshavali
description: "Community Lineage App - Track ancestry and family connections"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  
  # State Management
  provider: ^6.1.2
  
  # Backend - Supabase
  supabase_flutter: ^2.8.0
  
  # Local Storage & Offline Support
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  shared_preferences: ^2.3.3
  connectivity_plus: ^6.1.0
  
  # Deep Links
  app_links: ^6.3.2
  
  # Tree Visualization
  graphview: ^1.2.0
  
  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.1
  
  # Translation (free API)
  translator: ^1.0.0
  url_launcher: ^6.3.2
  share_plus: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  generate: true
  uses-material-design: true
  
  assets:
    - assets/images/
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
